name: 앱 만들기 (APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 압축 풀기
        run: unzip -q -o "$(ls *.zip | head -1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드
        working-directory: XinChao
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp XinChao/app/build/outputs/apk/debug/app-debug.apk XinChao.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 씬짜오 통역 v1.0.${{ github.run_number }}
          files: XinChao.apk
